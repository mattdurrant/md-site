name: Build and Publish Site

on:
  schedule:
    - cron: '07 0,6,12,18 * * *'   # 00:07, 06:07, 12:07, 18:07 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Speed up dotnet a touch
      - name: Speed up dotnet
        shell: bash
        run: |
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV
          echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" >> $GITHUB_ENV

      # Debug helper
      - name: Show repo layout
        shell: bash
        run: |
          pwd
          echo "Solutions:"; find . -maxdepth 6 -name "*.sln" -print
          echo "Projects:";  find . -maxdepth 10 -name "*.csproj" -print

      # ---------- TheSequelCommittee ----------
      - name: Locate TheSequelCommittee worker
        id: locate_sequel
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find "$GITHUB_WORKSPACE" -type f -maxdepth 12 -name 'TheSequelCommittee.Worker.csproj' -print -quit || true)"
          if [ -z "$csproj" ]; then csproj="$(find "$GITHUB_WORKSPACE" -type f -maxdepth 12 -iname '*Sequel*Worker*.csproj' -print -quit || true)"; fi
          if [ -z "$csproj" ]; then
            echo "Could not find TheSequelCommittee.Worker.csproj"; exit 1
          fi
          echo "csproj=$csproj"   >> "$GITHUB_OUTPUT"
          echo "projdir=$(dirname "$csproj")" >> "$GITHUB_OUTPUT"
      
      # 1) Pull forward last run's CSVs (artifact is mutable across runs)
      - name: Restore Sequel data (artifact)
        uses: actions/download-artifact@v4
        with:
          name: sequel-data
          path: ${{ steps.locate_sequel.outputs.projdir }}/out
        continue-on-error: true
      
      - name: Show restored CSVs
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ steps.locate_sequel.outputs.projdir }}/out"
          if [ -d "$dir" ]; then
            echo "Restored CSVs in $dir:"
            ls -l "$dir" | sed 's/^/  /'
          else
            echo "No previous CSVs restored (first run or no artifact yet)."
          fi
      
      - name: Restore (TheSequelCommittee)
        shell: bash
        run: dotnet restore "${{ steps.locate_sequel.outputs.csproj }}"
      
      - name: Build (TheSequelCommittee)
        shell: bash
        run: dotnet build "${{ steps.locate_sequel.outputs.csproj }}" -c Release --no-restore
      
      # Sunday = deep refresh, other days = incremental (no prune!)
      - name: Decide depth (Sunday = deep)
        shell: bash
        run: |
          if [ "$(date -u +%u)" = "7" ]; then echo "DEEP=1" >> $GITHUB_ENV; else echo "DEEP=0" >> $GITHUB_ENV; fi
      
      # Pass 1: discover/ratings/aggregate (with reuse, and NO prune on daily)
      - name: Run TheSequelCommittee (main pass)
        shell: bash
        working-directory: ${{ steps.locate_sequel.outputs.projdir }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${DEEP:-0}" = "1" ]; then
            # Big sweep once a week; allow fill/refresh
            ARGS="--pages 250 --min-movies 2 --allow-fill --refresh-ratings build-all"
          else
            # Daily: reuse + append, DO NOT prune missing collections
            ARGS="--pages 10 --min-movies 2 --reuse --no-prune build-all"
          fi
          echo "Sequel args: $ARGS"
          dotnet run -c Release --no-build -- $ARGS
      
      # Pass 2: always emit HTML even if pass 1 bails early
      - name: Run TheSequelCommittee (html-only)
        shell: bash
        working-directory: ${{ steps.locate_sequel.outputs.projdir }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          echo "Forcing HTML emission from current CSVs (html-only)…"
          dotnet run -c Release --no-build -- html-only || true
      
      # Diagnose: where did HTML land?
      - name: Locate Sequel outputs (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          echo "---- any index.html under worker/out ----"
          find "${{ steps.locate_sequel.outputs.projdir }}/out" -type f -name index.html -print || true
          echo "---- any 'sequelcommittee' dirs under worker/out ----"
          find "${{ steps.locate_sequel.outputs.projdir }}/out" -type d -name sequelcommittee -print || true
      
      # Copy to clean URL folder for Pages: /out/thesequelcommittee
      - name: Collect Sequel site into repo out (/thesequelcommittee)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/out/thesequelcommittee"
      
          candidates=(
            "${{ steps.locate_sequel.outputs.projdir }}/out/sequelcommittee"
            "${{ steps.locate_sequel.outputs.projdir }}/out/sequelcommittee/html"
            "${{ steps.locate_sequel.outputs.projdir }}/out/html"
          )
      
          src=""
          for d in "${candidates[@]}"; do
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then src="$d"; break; fi
          done
      
          if [ -z "$src" ]; then
            echo "::warning::Sequel output not found. The Sequel Committee pages won't update this run."
            exit 0
          fi
      
          echo "Copying from: $src"
          rsync -a "$src"/ "${{ github.workspace }}/out/thesequelcommittee"/
      
      # 3) Persist updated CSVs for next run (artifact overwrites each time)
      - name: Save Sequel data (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sequel-data
          path: |
            ${{ steps.locate_sequel.outputs.projdir }}/out/*.csv
            ${{ steps.locate_sequel.outputs.projdir }}/out/**/*.csv
          retention-days: 30


      # ---------- Feed (homepage) ----------
      - name: Locate Feed worker
        id: locate_feed
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find "$GITHUB_WORKSPACE" -type f -maxdepth 10 -iname 'Feed.Worker.csproj' -print -quit)"
          if [ -z "$csproj" ]; then
            echo "Could not find Feed.Worker.csproj"; exit 1
          fi
          echo "csproj=$csproj"   >> "$GITHUB_OUTPUT"
          echo "projdir=$(dirname "$csproj")" >> "$GITHUB_OUTPUT"

      - name: Restore (Feed)
        shell: bash
        run: dotnet restore "${{ steps.locate_feed.outputs.csproj }}"

      - name: Build (Feed)
        shell: bash
        run: dotnet build "${{ steps.locate_feed.outputs.csproj }}" -c Release --no-restore

      - name: Run Feed worker (writes /out/index.html)
        shell: bash
        working-directory: ${{ steps.locate_feed.outputs.projdir }}
        env:
          OUTPUT_DIR: ${{ github.workspace }}/out
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_PHOTOS_FOLDER: /Public/Photos
          GOODREADS_RSS_URL: ${{ secrets.GOODREADS_RSS_URL }}
        run: dotnet run -c Release

      # ---------- Albums ----------
      - name: Locate Albums worker
        id: locate_albums
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find "$GITHUB_WORKSPACE" -type f -maxdepth 10 -iname 'Albums.Worker.csproj' -print -quit)"
          if [ -z "$csproj" ]; then
            echo "Could not find Albums.Worker.csproj"; exit 1
          fi
          echo "csproj=$csproj"   >> "$GITHUB_OUTPUT"
          echo "projdir=$(dirname "$csproj")" >> "$GITHUB_OUTPUT"

      - name: Restore (Albums)
        shell: bash
        run: dotnet restore "${{ steps.locate_albums.outputs.csproj }}"

      - name: Build (Albums)
        shell: bash
        run: dotnet build "${{ steps.locate_albums.outputs.csproj }}" -c Release --no-restore

      - name: Run Albums worker (writes /albums and /ebay)
        shell: bash
        working-directory: ${{ steps.locate_albums.outputs.projdir }}
        env:
          OUTPUT_DIR: ${{ github.workspace }}/out/albums
          EBAY_OUTPUT_DIR: ${{ github.workspace }}/out
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          STAR_PLAYLISTS: ${{ secrets.STAR_PLAYLISTS }}
          FILLER_PLAYLIST_ID: ${{ vars.FILLER_PLAYLIST_ID }}
          EXCLUDED_PLAYLIST_ID: ${{ vars.EXCLUDED_PLAYLIST_ID }}
          PURCHASED_PLAYLIST_ID: ${{ vars.PURCHASED_PLAYLIST_ID }}
          TOP_N: ${{ vars.TOP_N }}
          EBAY_ALBUM_LIMIT: 250
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE: ${{ vars.EBAY_MARKETPLACE }}
          EBAY_DELIVERY_CC: ${{ vars.EBAY_DELIVERY_CC }}
          EBAY_MAX_PRICE_GBP: ${{ vars.EBAY_MAX_PRICE_GBP }}
          EBAY_PAGES_PER_QUERY: ${{ vars.EBAY_PAGES_PER_QUERY }}
          EBAY_LIMIT_PER_PAGE: ${{ vars.EBAY_LIMIT_PER_PAGE }}
          EBAY_QUERY_CONCURRENCY: ${{ vars.EBAY_QUERY_CONCURRENCY }}
          EBAY_MAX_RESULTS: ${{ vars.EBAY_MAX_RESULTS }}
        run: dotnet run -c Release

      # ---------- Fitness ----------
      - name: Locate Fitness worker
        id: locate_fitness
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find "$GITHUB_WORKSPACE" -type f -maxdepth 10 -iname 'Fitness.Worker.csproj' -print -quit)"
          if [ -z "$csproj" ]; then
            echo "Could not find Fitness.Worker.csproj"; exit 1
          fi
          echo "csproj=$csproj"   >> "$GITHUB_OUTPUT"
          echo "projdir=$(dirname "$csproj")" >> "$GITHUB_OUTPUT"

      - name: Restore (Fitness)
        shell: bash
        run: dotnet restore "${{ steps.locate_fitness.outputs.csproj }}"

      - name: Build (Fitness)
        shell: bash
        run: dotnet build "${{ steps.locate_fitness.outputs.csproj }}" -c Release --no-restore

      - name: Run Fitness worker (writes to /out/fitness)
        shell: bash
        working-directory: ${{ steps.locate_fitness.outputs.projdir }}
        env:
          OUTPUT_DIR: ${{ github.workspace }}/out
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: dotnet run -c Release

      # ---------- Photos ----------
      - name: Locate Photos worker
        id: locate_photos
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find "$GITHUB_WORKSPACE" -type f -maxdepth 10 -iname 'Photos.Worker.csproj' -print -quit)"
          if [ -z "$csproj" ]; then
            echo "Could not find Photos.Worker.csproj"; exit 1
          fi
          echo "csproj=$csproj"   >> "$GITHUB_OUTPUT"
          echo "projdir=$(dirname "$csproj")" >> "$GITHUB_OUTPUT"

      - name: Restore (Photos)
        shell: bash
        run: dotnet restore "${{ steps.locate_photos.outputs.csproj }}"

      - name: Build (Photos)
        shell: bash
        run: dotnet build "${{ steps.locate_photos.outputs.csproj }}" -c Release --no-restore

      - name: Run Photos worker (writes to /out/photos)
        shell: bash
        working-directory: ${{ steps.locate_photos.outputs.projdir }}
        env:
          OUTPUT_DIR: ${{ github.workspace }}/out
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_PHOTOS_FOLDER: /Public/Photos
        run: dotnet run -c Release

      # ---------- Goodreads ----------
      - name: Locate Goodreads worker
        id: locate_goodreads
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find "$GITHUB_WORKSPACE" -type f -maxdepth 10 -iname 'Goodreads.Worker.csproj' -print -quit)"
          if [ -z "$csproj" ]; then
            echo "Could not find Goodreads.Worker.csproj"; exit 1
          fi
          echo "csproj=$csproj"   >> "$GITHUB_OUTPUT"
          echo "projdir=$(dirname "$csproj")" >> "$GITHUB_OUTPUT"

      - name: Restore (Goodreads)
        shell: bash
        run: dotnet restore "${{ steps.locate_goodreads.outputs.csproj }}"

      - name: Build (Goodreads)
        shell: bash
        run: dotnet build "${{ steps.locate_goodreads.outputs.csproj }}" -c Release --no-restore

      - name: Check Goodreads secret presence
        shell: bash
        env:
          GOODREADS_RSS_URL: ${{ secrets.GOODREADS_RSS_URL }}
        run: |
          if [ -z "${GOODREADS_RSS_URL:-}" ]; then
            echo "GOODREADS_RSS_URL is NOT set"; exit 1
          else
            echo "GOODREADS_RSS_URL is present"
          fi

      - name: Run Goodreads worker (writes to /out/books)
        shell: bash
        working-directory: ${{ steps.locate_goodreads.outputs.projdir }}
        env:
          OUTPUT_DIR: ${{ github.workspace }}/out
          GOODREADS_RSS_URL: ${{ secrets.GOODREADS_RSS_URL }}
        run: dotnet run -c Release

      # ---------- Copy static assets ----------
      - name: Copy static assets
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/out"
          cp -v assets/styles.css "${{ github.workspace }}/out/styles.css"
          cp -v assets/albums.css "${{ github.workspace }}/out/albums.css"

      # ---------- Configure & Publish ----------
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inspect out dir (sanity)
        shell: bash
        run: |
          echo "----- tree of out ------"
          find "${{ github.workspace }}/out" -maxdepth 4 -type f -print
          echo "----- sequel index head ---"
          head -n 40 "${{ github.workspace }}/out/thesequelcommittee/index.html" || true
          echo "----- site index head ---"
          head -n 40 "${{ github.workspace }}/out/index.html" || true

      - name: Write CNAME
        shell: bash
        run: echo "www.mattdurrant.com" > "${{ github.workspace }}/out/CNAME"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/out
          name: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
